[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libras_anki"
version = "0.1.0"
description = "Gerador de Decks Anki para estudo de Libras"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "eduardobn", email = "eduardo@edbn.dev"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "yt-dlp",
    "ffmpeg-python",
    "genanki",
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "secretstorage>=3.3.0",
]

[project.scripts]
libras-anki = "libras_anki.cli:main"
libras-anki-gui = "libras_anki.gui.app:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=libras_anki --cov-report=term-missing"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src/libras_anki"]
